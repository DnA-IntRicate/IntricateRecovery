[raptor]
version = "1.0.0"

[raptor.paths]
docs_dir = "docs"
temp_dir = "tmp"
tools_dir = "Tools"

[raptor.setup]
headless = false

[[raptor.setup.environment]]
name = "git"
min_version = "2.53.0"

# [[raptor.setup.environment]]
# name = "git-hooks"
# min_version = "1.2.0"

[raptor.doctor]
[[raptor.doctor.checks]]
name = "git"
# [[raptor.doctor.checks]]
# name = "git-hooks"
[[raptor.doctor.checks]]
name = "visualstudio"
[[raptor.doctor.checks]]
name = "windows"
[[raptor.doctor.checks]]
name = "cpp23"

[raptor.premake]
default_action = "vs2026"
supported_actions = ["vs2026", "vs2022"]

[raptor.workspace]
dir = "."
name = "IntricateRecovery"
configs = ["Debug", "Dev", "Release"]
default_config = "Dev"
default_arch = "x64"

[raptor.workspace.executable_projects.IntricateRecovery]
dir = "IntricateRecovery"
language = "cpp"
arch = "x64"
build_mode = "solution"

[raptor.clean.targets.workspace]
search_dirs = [
    ".",
    "IntricateRecovery"
]
delete_dirs = []
files = [".raptordoctor"]
file_exts = [
    ".csproj",
    ".vcxproj",
    ".vcxproj.filters",
    ".vcxproj.user",
    ".sln",
    ".slnx"
]
depth = "shallow"

[raptor.clean.targets.bin]
search_dirs = ["."]
delete_dirs = ["bin"]
files = []
file_exts = []
depth = "shallow"

[raptor.clean.targets.int]
search_dirs = ["."]
delete_dirs = ["bin/int", "bin/intermediate", "bin/obj"]
files = []
file_exts = []
depth = "shallow"
